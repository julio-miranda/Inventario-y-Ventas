<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Empleados</title>

    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar" role="navigation" aria-label="Barra de navegación">
        <div class="navbar-logo">
            <a href="#">MiEmpresa</a>
        </div>

        <!-- LINKS y USUARIO (desktop) -->
        <div class="navbar-right">
            <div class="navbar-links">
                <ul>
                    <li><a href="dashboard.html">Inicio</a></li>
                    <li><a href="inventory.html">Inventario</a></li>
                    <li><a href="sales.html">Ventas</a></li>
                    <li><a href="attendance.html">Asistencia</a></li>
                    <li><a href="employees.html">Empleados</a></li>
                </ul>
            </div>

            <div class="navbar-user">
                <span class="userGreeting">Hola, Usuario</span>
                <button id="logoutButton" class="btn-delete">Cerrar sesión</button>
            </div>
        </div>

        <!-- BOTON HAMBURGUESA (solo mobile) -->
        <button class="menu-toggle" id="menuToggle" aria-controls="fullscreenMenu" aria-expanded="false"
            aria-label="Abrir menú">
            <i class="fas fa-bars" aria-hidden="true"></i>
        </button>
    </nav>

    <!-- MENU OVERLAY -->
    <div class="fullscreen-menu" id="fullscreenMenu" aria-hidden="true">
        <div class="close-menu" id="closeMenu" role="button" aria-label="Cerrar menú" tabindex="0">
            <i class="fas fa-times"></i>
        </div>

        <ul class="menu-links" role="menu">
            <li role="none"><a role="menuitem" href="dashboard.html">Inicio</a></li>
            <li role="none"><a role="menuitem" href="inventory.html">Inventario</a></li>
            <li role="none"><a role="menuitem" href="sales.html">Ventas</a></li>
            <li role="none"><a role="menuitem" href="attendance.html">Asistencia</a></li>
            <li role="none"><a role="menuitem" href="employees.html">Empleados</a></li>
        </ul>

        <div class="menu-user">
            <span class="userGreeting">Hola, Usuario</span>
            <button id="logoutButtonMobile" class="btn-delete">Cerrar sesión</button>
        </div>
    </div>

    <!-- CONTENIDO -->
    <main class="employees">

        <h1>Gestión de Empleados</h1>

        <input type="text" id="searchEmployee" placeholder="Buscar empleado...">

        <button id="btnNewEmployee" class="btn-primary">
            <i class="fas fa-user-plus"></i>
            Nuevo empleado
        </button>

        <div class="table-container">
            <table id="employeesTable">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Posición</th>
                        <th>Teléfono</th>
                        <th>Local</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td colspan="5">
                            Cargando empleados...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- SWEET ALERT -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- APP -->
    <script src="assets/js/app.js"></script>
    <script src="assets/js/employees.js"></script>

</body>

</html>
