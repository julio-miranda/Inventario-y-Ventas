<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Sistema de Gestión</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tus estilos -->
  <link rel="stylesheet" href="assets/css/styles.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>

  <!-- SweetAlert2 -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-container" role="main" aria-labelledby="loginTitle">
    <div class="login-header">
      <i class="fas fa-boxes fa-3x" style="color: #4CAF50;" aria-hidden="true"></i>
      <h2 id="loginTitle">Bienvenido</h2>
      <p>Ingresa tus credenciales para acceder</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="input-group">
        <label for="email"><i class="fas fa-envelope" aria-hidden="true"></i> Correo Electrónico</label>
        <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com" autocomplete="username" />
      </div>

      <div class="input-group">
        <label for="password"><i class="fas fa-lock" aria-hidden="true"></i> Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password" />
      </div>

      <div style="display:flex; align-items:center; gap:10px; margin-top:8px;">
        <input type="checkbox" id="rememberMe" />
        <label for="rememberMe" style="font-size:0.95rem;">Recordarme</label>
      </div>

      <button type="submit" id="btnLogin" aria-live="polite" aria-busy="false">
        <span id="btnText">Iniciar Sesión</span>
        <i id="btnSpinner" class="fas fa-spinner fa-spin" style="display:none; margin-left:8px;" aria-hidden="true"></i>
      </button>

      <div id="error-message" class="error-banner" style="display:none;" role="alert"></div>

      <div class="footer-links" style="margin-top:12px; text-align:center;">
        <button type="button" id="forgotPasswordLink" class="link-button">
          ¿Olvidaste tu contraseña?
        </button>
      </div>
    </form>
  </div>

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Tu script -->
  <script src="assets/js/app.js"></script>
</body>
</html>
