<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Asistencia - Sistema de Gestión</title>

    <link rel="stylesheet" href="assets/css/styles.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="" crossorigin="anonymous" />

    <!-- SweetAlert2 (opcional) -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar" role="navigation">

        <div class="navbar-logo">
            <a href="#">MiEmpresa</a>
        </div>

        <!-- Contenedor derecho (desktop) -->
        <div class="navbar-right" id="navbarRight" aria-hidden="false">
            <div class="navbar-links" role="menubar" aria-label="Navegación principal">
                <ul>
                    <li role="none"><a role="menuitem" href="dashboard.html">Inicio</a></li>
                    <li role="none"><a role="menuitem" href="inventory.html">Inventario</a></li>
                    <li role="none"><a role="menuitem" href="sales.html">Ventas</a></li>
                    <li role="none"><a role="menuitem" href="attendance.html">Asistencia</a></li>
                    <li role="none"><a role="menuitem" href="employees.html">Empleados</a></li>
                </ul>
            </div>

            <div class="navbar-user" aria-hidden="false">
                <span class="userGreeting">Hola, Usuario</span>
                <button id="logoutButtonNav">Cerrar sesión</button>
            </div>
        </div>

        <!-- BOTON HAMBURGUESA (mobile) -->
        <div class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false" role="button" tabindex="0">
            <i class="fas fa-bars" aria-hidden="true"></i>
        </div>

    </nav>

    <!-- MENU OVERLAY -->
    <div class="fullscreen-menu" id="fullscreenMenu" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Menú principal">

        <div class="close-menu" id="closeMenu" role="button" tabindex="0" aria-label="Cerrar menú">
            <i class="fas fa-times" aria-hidden="true"></i>
        </div>

        <ul class="menu-links" role="menu">
            <li role="none"><a role="menuitem" href="dashboard.html">Inicio</a></li>
            <li role="none"><a role="menuitem" href="inventory.html">Inventario</a></li>
            <li role="none"><a role="menuitem" href="sales.html">Ventas</a></li>
            <li role="none"><a role="menuitem" href="attendance.html">Asistencia</a></li>
            <li role="none"><a role="menuitem" href="employees.html">Empleados</a></li>
        </ul>

        <div class="menu-user" role="group" aria-label="Usuario">
            <span class="userGreeting">Hola, Usuario</span>
            <button id="logoutButton">Cerrar sesión</button>
        </div>

    </div>

    <main class="attendance" role="main" aria-live="polite">
        <h1>Registrar Asistencia</h1>

        <div class="search-bar" role="search" aria-label="Buscar asistencia">
            <label for="attendanceFilter" style="margin-right:8px;">Buscar:</label>
            <input id="attendanceFilter" type="search" placeholder="Filtrar por empleado o estado..." />
        </div>

        <!-- Formulario para registrar asistencia -->
        <form id="attendanceForm" style="max-width:520px; margin-bottom:18px;">
            <label for="employeeSelect">Empleado</label>
            <select id="employeeSelect" required>
                <option value="">-- Seleccione un empleado --</option>
            </select>

            <label for="attendanceStatus">Estado</label>
            <select id="attendanceStatus" required>
                <option value="Presente">Presente</option>
                <option value="Ausente">Ausente</option>
                <option value="Tarde">Tarde</option>
                <option value="Permiso">Permiso</option>
            </select>

            <div style="display:flex; gap:8px; margin-top:8px;">
                <button type="submit" id="btnRegisterAttendance" class="btn-primary"><i class="fas fa-check"></i>
                    Registrar Asistencia</button>
                <button type="button" id="btnClearAttendance" class="btn-outline">Limpiar</button>
            </div>
        </form>

        <h2 id="Historial">Historial de Asistencia</h2>
        <div class="table-container">
            <table id="attendanceTable" class="table" aria-describedby="attendanceTableDesc">
                <caption id="attendanceTableDesc" style="display:none;">Historial de asistencias</caption>
                <thead>
                    <tr>
                        <th>Empleado</th>
                        <th>Fecha / Hora</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- filas dinámicas -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Firebase (v8) y SweetAlert2 si los usas -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- app.js (inicializa firebase, auth, etc.) -->
    <script src="assets/js/app.js"></script>

    <!-- lógica específica de attendance (incluye menú, sync usuario, logout) -->
    <script src="assets/js/attendance.js"></script>
</body>

</html>
