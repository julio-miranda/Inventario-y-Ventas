<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Facturación - Sistema de Gestión</title>
  <link rel="stylesheet" href="assets/css/invoices.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="navbar-logo">
      <a href="dashboard.html">MiEmpresa</a>
    </div>

    <!-- Desktop right part -->
    <div class="navbar-right">
      <div class="navbar-links" role="menubar" aria-label="Main links">
        <ul>
          <li><a href="dashboard.html">Inicio</a></li>
          <li><a href="inventory.html">Inventario</a></li>
          <li><a href="sales.html">Ventas</a></li>
          <li><a href="attendance.html">Asistencia</a></li>
          <li><a href="invoices.html">Facturación</a></li>
        </ul>
      </div>

      <div class="navbar-user" aria-label="User">
        <span id="userGreeting">Hola, Usuario</span>
        <button id="logoutButton" class="logout-btn">Cerrar sesión</button>
      </div>
    </div>

    <!-- Mobile menu toggle -->
    <div class="menu-toggle" id="menuToggle" aria-label="Abrir menú móvil" role="button" tabindex="0">
      <i class="fas fa-bars" aria-hidden="true"></i>
    </div>
  </nav>

  <!-- Fullscreen menu (móvil) -->
  <div class="fullscreen-menu" id="fullscreenMenu" aria-hidden="true">
    <div class="close-menu" id="closeMenu" role="button" tabindex="0">
      <i class="fas fa-times" aria-hidden="true"></i>
    </div>

    <ul class="menu-links" role="menu">
      <li><a href="dashboard.html">Inicio</a></li>
      <li><a href="inventory.html">Inventario</a></li>
      <li><a href="sales.html">Ventas</a></li>
      <li><a href="attendance.html">Asistencia</a></li>
      <li><a href="invoices.html">Facturación</a></li>
    </ul>

    <div class="menu-user">
      <span id="userGreetingMobile">Hola, Usuario</span>
      <button id="logoutMobile" class="logout-btn">Cerrar sesión</button>
    </div>
  </div>

  <!-- Sección de Facturación -->
  <main class="invoices" role="main">
    <h1>Generar Factura</h1>

    <form id="invoiceForm" aria-label="Generar factura">
      <label for="customerName">Nombre del Cliente</label>
      <input type="text" id="customerName" required />

      <label for="saleSelect">Venta</label>
      <select id="saleSelect" required>
        <option value="">-- Selecciona una venta --</option>
      </select>

      <button type="submit" class="btn-primary">Generar Factura</button>
    </form>

    <h2>Historial de Facturación</h2>
    <table id="invoiceTable" aria-describedby="Historial de facturas">
      <thead>
        <tr>
          <th>Factura</th>
          <th>Cliente</th>
          <th>Total</th>
          <th>Fecha</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- filas dinámicas -->
      </tbody>
    </table>
  </main>

  <!-- Librerías y scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Pequeño script para menu toggle y sincronizar greeting -->
  <script>
    // Menu toggle
    const menuToggle = document.getElementById('menuToggle');
    const fullscreenMenu = document.getElementById('fullscreenMenu');
    const closeMenu = document.getElementById('closeMenu');

    menuToggle && menuToggle.addEventListener('click', () => {
      fullscreenMenu.classList.add('active');
      fullscreenMenu.setAttribute('aria-hidden', 'false');
    });

    closeMenu && closeMenu.addEventListener('click', () => {
      fullscreenMenu.classList.remove('active');
      fullscreenMenu.setAttribute('aria-hidden', 'true');
    });

    // cerrar con ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        fullscreenMenu.classList.remove('active');
        fullscreenMenu.setAttribute('aria-hidden', 'true');
      }
    });

    // sincronizar saludo entre navbar y menu mobile (si los maneja JS)
    const userGreeting = document.getElementById('userGreeting');
    const userGreetingMobile = document.getElementById('userGreetingMobile');
    if (userGreeting && userGreetingMobile) {
      userGreetingMobile.textContent = userGreeting.textContent;
    }

    // ejemplo: attach logout handlers (rellena con tu lógica)
    document.getElementById('logoutButton')?.addEventListener('click', () => {
      // tu lógica de logout
      console.log('Logout desktop');
    });
    document.getElementById('logoutMobile')?.addEventListener('click', () => {
      // tu lógica de logout
      console.log('Logout mobile');
    });
  </script>

  <!-- tu app.js / invoices.js -->
  <script src="assets/js/app.js"></script>
  <script src="assets/js/invoices.js"></script>
</body>
</html>
