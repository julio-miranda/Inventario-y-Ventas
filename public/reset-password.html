<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Restablecer contraseña - Sistema de Gestión</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-container" role="main" aria-labelledby="resetTitle">
    <div class="login-header">
      <i class="fas fa-key fa-3x" style="color: #4CAF50;" aria-hidden="true"></i>
      <h2 id="resetTitle">Restablecer contraseña</h2>
      <p>Define una nueva contraseña para tu cuenta</p>
    </div>

    <div id="accountInfo" class="footer-links" style="margin-bottom:14px; text-align:center; font-size:0.92rem; color:#374151;">
      <span id="accountEmail">Verificando enlace...</span>
    </div>

    <form id="resetForm" novalidate>
      <div class="input-group">
        <label for="newPassword"><i class="fas fa-lock" aria-hidden="true"></i> Nueva contraseña</label>
        <input
          type="password"
          id="newPassword"
          name="newPassword"
          required
          minlength="6"
          placeholder="Mínimo 6 caracteres"
          autocomplete="new-password"
        />
      </div>

      <div class="input-group">
        <label for="confirmPassword"><i class="fas fa-lock" aria-hidden="true"></i> Confirmar contraseña</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          required
          minlength="6"
          placeholder="Repite la nueva contraseña"
          autocomplete="new-password"
        />
      </div>

      <button type="submit" id="btnLogin" aria-live="polite" aria-busy="false">
        <span id="btnText">Cambiar contraseña</span>
        <i id="btnSpinner" class="fas fa-spinner fa-spin" style="display:none; margin-left:8px;" aria-hidden="true"></i>
      </button>

      <div id="error-message" class="error-banner" style="display:none;" role="alert"></div>

      <div class="footer-links" style="margin-top:12px; text-align:center;">
        <a href="index.html">Volver al inicio de sesión</a>
      </div>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="assets/js/reset-password.js"></script>
</body>
</html>
